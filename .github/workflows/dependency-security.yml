name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.23'
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python }} --no-build --no-install-project
      - name: Install application
        run: uv pip install --no-deps -e .
      - name: Check dependency consistency
        run: uv pip check
      - name: Import native dependencies
        run: uv run --locked python -c "import PIL._imaging, pydantic_core, cryptography, _cffi_backend, lxml.etree, primp"
      - name: Test locked installation
        run: uv run --locked pytest -q -m "not ui"
      - name: Lint
        run: uv run --locked ruff check src tests scripts/check_wheel_install.py scripts/check_dependabot_resolution.py
      - name: Type check
        run: uv run --locked mypy src/
      - name: Install Chromium for UI tests
        if: matrix.python == '3.14'
        run: uv run --locked playwright install --with-deps chromium
      - name: Test chat Stop button in Chromium
        if: matrix.python == '3.14'
        run: |
          uv run --locked python -c "from pathlib import Path; Path('.cache').mkdir(exist_ok=True)"
          uv run --locked pytest -q -m ui --basetemp .cache/ui-tests
      - name: Upload UI diagnostics
        if: failure() && matrix.python == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-diagnostics-${{ matrix.os }}
          path: .cache/ui-tests
      - name: Build distributions
        run: uv build --out-dir dist/security-validation
      - name: Test ordinary pip wheel installation
        run: uv run --locked python scripts/check_wheel_install.py
