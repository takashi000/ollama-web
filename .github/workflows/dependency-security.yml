name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.23'
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Check dependency consistency
        run: uv pip check
      - name: Test locked installation
        run: uv run --locked pytest -q
      - name: Lint
        run: uv run --locked ruff check src tests scripts/check_wheel_install.py
      - name: Type check
        run: uv run --locked mypy src/
      - name: Build wheel
        run: uv build --wheel
      - name: Test ordinary pip wheel installation
        run: uv run --locked python scripts/check_wheel_install.py
