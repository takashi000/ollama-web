[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-web"
version = "0.5.4"
description = "Ollama web project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "ollama>=0.6.2",
    "ddgs>=9.16.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "pypdf>=6.21.2,<7",
    "python-multipart>=0.0.9",
    "Pillow>=13.0.0,<14",
    "mcp>=1.30.0,<2",
    # Security floors also apply to installations that do not use uv.lock.
    "anyio>=4.14.2,<5",
    "PyJWT>=2.15.1,<3",
    "soupsieve>=2.9.0,<3",
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ollama-web = "ollama_web.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ollama_web = [
    "i18n/messages/*.json",
    "prompts/*.json",
    "static/*.css",
    "static/*.js",
    "static/vendor/*.css",
    "static/vendor/*.js",
    "static/vendor/*.map",
    "static/vendor/fonts/*.ttf",
    "static/vendor/fonts/*.woff",
    "static/vendor/fonts/*.woff2",
    "templates/*.html",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
strict = true
